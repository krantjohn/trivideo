appId: com.trivideo.app
productName: 同画
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 同画
  guid: 9a0860ac-5b35-56d3-9062-a2697b0588fb
  include: build/installer.nsh
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  artifactName: TriVideo-Setup-${version}.${ext}
portable:
  artifactName: TriVideo-Portable-${version}.${ext}
publish:
  provider: github
  owner: krantjohn
  repo: trivideo
